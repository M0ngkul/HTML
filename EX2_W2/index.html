<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <div class="container">

        <div class="profile">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiIfLEW28IyBCLmg_ccX5h06ot2C-_bkLjMMmvG7zqEA&s=10"/>
            <h2>Paquito</h2>
            <p class="role">Assasin/Fighter</p>
        </div>

        <div class="status">
            <div>
                <h3>Matches: </h3>
                <p class="number">1168</p>
            </div>

            <div>
                <h3>Winrate: </h3>
                <p class="number">98%</p>
            </div>

            <div>
                <h3>Win: </h3>
                <p class="number">1167</p>
            </div>
            <div>
                <h3>Lose: </h3>
                <p class= "number">1</p>

            </div>
            <div>
                <h3>MMR: </h3>
                <p class="number">100000</p>
            </div>
        </div>
        <div class="bio">
            <p>I love You!</p>
        </div>
        <div class="social">
         <a href="https://facebook.com">
          <i class="fa-brands fa-facebook-f"></i>
         </a>
         <a href="https://instagram.com">
          <i class="fa-brands fa-instagram"></i>
         </a>
         <a href="https://linkedin.com">
          <i class="fa-brands fa-linkedin-in"></i>
         </a>
         <a href="https://telegram.org">
          <i class="fa-brands fa-telegram"></i>
         </a>
        </div>
        <button>Veiw Profile</button>
    </div>

</body>
</html>
